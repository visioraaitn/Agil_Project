services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL Supabase requis}
      API_PORT: 3000
      API_PREFIX: /api/v1
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET requis}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requis}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT requis}
      S3_REGION: ${S3_REGION:?S3_REGION requis}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET requis}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY requis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY requis}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-VisioraAI Agile <no-reply@visiora.ai>}
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-80}:80'

volumes:
  uploads:
