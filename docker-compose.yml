services:
  postgres:
    image: postgres:16-alpine
    container_name: visiora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: visiora
      POSTGRES_PASSWORD: visiora
      POSTGRES_DB: visiora_agile
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U visiora -d visiora_agile']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: visiora-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # Stockage objet compatible S3 pour les pièces jointes (D.2)
  minio:
    image: minio/minio:latest
    container_name: visiora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: visiora
      MINIO_ROOT_PASSWORD: visiora123
    ports:
      - '9000:9000'
      - '9001:9001' # console web
    volumes:
      - minio_data:/data

  # Boîte mail de développement — capture les emails sans rien envoyer (G.1)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: visiora-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # UI web

volumes:
  postgres_data:
  redis_data:
  minio_data:
