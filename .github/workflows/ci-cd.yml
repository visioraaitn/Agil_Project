name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ vars.CI_DATABASE_URL }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_API_DOCS_URL: ${{ vars.VITE_API_DOCS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma client
        run: |
          pnpm --filter @visiora/api exec prisma validate
          pnpm --filter @visiora/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy production
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}

    steps:
      - name: Deploy backend
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST \
            "$RENDER_DEPLOY_HOOK_URL" --output /dev/null

      - name: Deploy frontend
        run: |
          test -n "$NETLIFY_BUILD_HOOK_URL"
          curl --fail --silent --show-error --request POST \
            "$NETLIFY_BUILD_HOOK_URL" --output /dev/null
