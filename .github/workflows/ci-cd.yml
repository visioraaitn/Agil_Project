name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  database-changes:
    name: Detect database changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.database }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Detect Prisma changes
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6
        with:
          filters: |
            database:
              - 'apps/api/prisma/schema.prisma'
              - 'apps/api/prisma/migrations/**'

  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ github.event_name == 'pull_request' && 'postgresql://ci:ci@127.0.0.1:5432/visiora_ci' || vars.CI_DATABASE_URL }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_API_DOCS_URL: ${{ vars.VITE_API_DOCS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma client
        run: |
          pnpm --filter @visiora/api exec prisma validate
          pnpm --filter @visiora/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migrate:
    name: Migrate production database
    needs:
      - checks
      - database-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.database-changes.outputs.changed == 'true'
    uses: ./.github/workflows/database-production.yml
    secrets: inherit

  deploy:
    name: Deploy production
    needs:
      - checks
      - database-changes
      - migrate
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' &&
      needs.database-changes.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}

    steps:
      - name: Deploy backend
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST \
            "$RENDER_DEPLOY_HOOK_URL" --output /dev/null

      - name: Deploy frontend
        run: |
          test -n "$NETLIFY_BUILD_HOOK_URL"
          curl --fail --silent --show-error --request POST \
            "$NETLIFY_BUILD_HOOK_URL" --output /dev/null
